<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaronOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/browser.css">
    <link rel="stylesheet" href="css/petal.css">
</head>
<body>
    <div class="top">
        <p style="margin-left: 16px;">jaronos</p>
        <p id="liveClock"></p>
    </div>
    <div class="desktop-icons">
        <button class="desktop-icon" type="button" data-opens-window="jaronaWindow" aria-label="Open Jarona">
            <span class="app-icon jarona-icon" aria-hidden="true"><i class="fa-solid fa-fan"></i></span>
            <span>Jarona</span>
        </button>
        <button class="desktop-icon" type="button" data-opens-window="welcomeWindow" aria-label="Open Welcome">
            <span class="app-icon welcome-icon" aria-hidden="true"><i class="fa-solid fa-door-open"></i></span>
            <span>Welcome</span>
        </button>
        <button class="desktop-icon" id="filesLauncher" type="button" data-opens-window="browserWindow" aria-label="Open Browser">
            <span class="app-icon browser-icon" aria-hidden="true"><i class="fa-solid fa-globe"></i></span>
            <span>Browser</span>
        </button>
        <button class="desktop-icon" type="button" data-opens-window="customWindow" aria-label="Open Settings">
            <span class="app-icon settings-icon" aria-hidden="true"><i class="fa-solid fa-gear"></i></span>
            <span>Settings</span>
        </button>
        <button class="desktop-icon" type="button" data-opens-window="weatherWindow" aria-label="Open Settings">
            <span class="app-icon weather-icon" aria-hidden="true"><i class="fa-solid fa-cloud"></i></span>
            <span>Weather</span>
        </button>
    </div>
    <div class="window is-closed" id="weatherWindow" style="top: 180px; left: 80px;">
        <div class="window-header">
            <span>weather</span>
            <div class="window-controls">
                <button class="maximize-window" type="button" aria-label="Maximize window">&#9633;</button>
                <button class="close-window" type="button" aria-label="Close window">&times;</button>
            </div>
        </div>
        <div class="window-content">
            <div class="widget-icon" id="weatherIcon">🌤</div>
            <div class="details">
                <div class="temp" id="weatherTemp">72°</div>
                <div class="location" id="weatherLoc">Los Angeles, CA</div>
                <div class="description" id="weatherDesc">Burningly Hot.</div>
            </div>
            <script src="js/weather.js"></script>
        </div>
    </div>
    <div class="window woa is-closed" id="jaronaWindow" style="top: 180px; left: 80px;">
        <div class="window-header">
            <span>jarona</span>
            <div class="window-controls">
                <button class="maximize-window" type="button" aria-label="Maximize window">&#9633;</button>
                <button class="close-window" type="button" aria-label="Close window">&times;</button>
            </div>
        </div>
        <div class="window-content">
            <h1>its my jarona!</h1>
        </div>
    </div>
    <div class="window welcome" id="welcomeWindow" style="top: 240px; left: 360px;">
        <div class="window-header">
            <span>Welcome</span>
            <div class="window-controls">
                <button class="maximize-window" type="button" aria-label="Maximize window">&#9633;</button>
                <button class="close-window" type="button" aria-label="Close window">&times;</button>
            </div>
        </div>
        <div class="window-content">
        <audio id="themusic" loop>
            <source src="music/driving.mp3" type="audio/mpeg">
            Audio is disabled
        </audio>

        <h1>Welcome to JaronOS</h1>
        <p>This site is based off of deltarune chapter 5, but it is still very enjoyable if you haven't played it.</p>
        <button id="musicButton" onclick="toggleMusic()">turn on music</button>
        <script>
        const music = document.getElementById("themusic");
        const button = document.getElementById("musicButton");
        let isMediaLoading = false; 

        function toggleMusic() {
            if (!music) {
                console.error("Could not find the HTML audio element with ID 'themusic'.");
                return;
            }

            if (isMediaLoading) return;

            if (music.paused) {
                isMediaLoading = true;
                
                music.play()
                    .then(() => {
                        isMediaLoading = false; 
                        button.textContent = "turn off music";
                    })
                    .catch(error => {
                        isMediaLoading = false; 
                        console.error("Playback failed:", error);
                    });
            } else {
                music.pause();
                button.textContent = "you turned it on and then off again??? how rude.";
            }
        }
        </script>
        </div>
    </div>
    <div class="window browse is-closed" id="browserWindow" style="top: 180px; left: 680px;">
        <div class="window-header">
            <span>Browser</span>
            <div class="window-controls">
                <button class="maximize-window" type="button" aria-label="Maximize window">&#9633;</button>
                <button class="close-window" type="button" aria-label="Close window">&times;</button>
            </div>
        </div>
        <div class="browser-container">
            <div class="browser-header">
                <div class="nav-buttons">
                    <button id="back-btn" title="Back">←</button>
                    <button id="forward-btn" title="Forward">→</button>
                    <button id="reload-btn" title="Reload">↻</button>
                </div>

                <form id="address-form" class="address-bar-container">
                    <input type="text" id="address-bar" placeholder="Search or enter a web address">
                    <button type="submit" id="go-btn">Go</button>
                </form>
            </div>

            <div class="browser-body">
                <iframe id="web-viewport" src="https://www.google.com/search?igu=1" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
            <script src="js/browser.js"></script>
        </div>
    </div>
    <div class="window woa is-closed" id="customWindow" style="top: 320px; left: 160px;">
        <div class="window-header">
            <span>settings</span>
            <div class="window-controls">
                <button class="maximize-window" type="button" aria-label="Maximize window">&#9633;</button>
                <button class="close-window" type="button" aria-label="Close window">&times;</button>
            </div>
        </div>
        <div class="window-content">
            <h1>Settings</h1>
            <button onclick="changeBackground()">Change Background</button>
        </div>
    </div>
    <script src="js/time.js"></script>
    <script src="js/window.js"></script>
    <script src="js/petal.js"></script>
    <script src="js/background.js"></script>
    <script src="https://kit.fontawesome.com/290c5a7a5b.js" crossorigin="anonymous"></script>
</body>
</html>
